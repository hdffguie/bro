name: Generate Video Automation

on:
  workflow_dispatch: # Ye aapko GitHub UI se manually run karne ka option dega
  # schedule:
  #   - cron: '0 0 * * *' # Agar roz raat 12 baje auto-run karna ho toh isko uncomment karein

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Script
        run: node index.js

      # Agar script PASS ho jaye toh video ko Artifact mein save karo
      - name: Upload Video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Video
          path: generated_video.mp4

      # Agar script FAIL ho jaye toh Screenshot ko Artifact mein save karo
      - name: Upload Error Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Error-Screenshot
          path: error_screenshot.png
