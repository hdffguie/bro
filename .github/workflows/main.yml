name: Playwright Automation

on:
  workflow_dispatch: # Yeh aapko GitHub se manually button click karke run karne dega

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests
        playwright install chromium

    - name: Run Playwright script
      run: python your_script_name.py # Apne python file ka naam likhein

    # Agar upar wala step fail hota hai (error aati hai), toh yeh step screenshot ko save kar lega
    - name: Upload Error Screenshot to GitHub Artifacts
      if: failure() 
      uses: actions/upload-artifact@v4
      with:
        name: error-screenshot
        path: error_screenshot.png
