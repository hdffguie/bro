name: Automated Image and Video Pipeline

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies & Playwright
      run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    # STEP 1: Generate All Images Sequentially
    - name: Run Bing Image Generator
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py --machine_id 1 --total_machines 1

    # STEP 2: Run Dynamic Video Generation (Max 3 Machines in Parallel)
    - name: Run Upsampler Video Generator
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python -c "
        import os, math
        image_dir = 'bing_automated_images'
        if os.path.exists(image_dir):
            images = [f for f in os.listdir(image_dir) if f.startswith('Generated_Image_') and f.endswith('.jpg')]
            total = len(images)
            print(f'Total Images Found: {total}')
            if total > 0:
                # Max 3 machines chalengi
                total_machines = min(3, total)
                print(f'Spawning {total_machines} parallel machine(s)...')
                for m_id in range(1, total_machines + 1):
                    print(f'--- Running Machine {m_id} of {total_machines} ---')
                    os.system(f'python generate_video.py {m_id} {total_machines}')
        "

    # STEP 3: Compress All Videos into a Single ZIP
    - name: Create Videos ZIP Archive
      if: always()
      run: |
        zip -r generated_videos.zip generated_videos/

    # STEP 4: Upload ZIP to GitHub Artifacts
    - name: Upload Videos ZIP Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: All_Generated_Videos_ZIP
        path: generated_videos.zip
