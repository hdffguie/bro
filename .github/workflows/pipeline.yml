name: Automated Image and Video Pipeline

on:
  workflow_dispatch:

jobs:
  generate-images:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium
    - name: Run Bing Image Generator
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py --machine_id 1 --total_machines 1

    - name: Save Images Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bing_images
        path: bing_automated_images/

  generate-videos:
    needs: generate-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2  # 🔥 Ek sath sirf 2 machines chalengi taaki IP limit na aaye!
      matrix:
        machine_id: [1, 2, 3, 4, 5] # Jitni images hain us hisab se yahan numbers badha sakte ho

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Download Images Artifact
      uses: actions/download-artifact@v4
      with:
        name: bing_images
        path: bing_automated_images/

    - run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    - name: Run Upsampler Video Generator
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_video.py ${{ matrix.machine_id }} 5

    - name: Save Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: video_machine_${{ matrix.machine_id }}
        path: generated_videos/
