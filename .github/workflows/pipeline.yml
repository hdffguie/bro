name: Automated Image and Video Pipeline

on:
  workflow_dispatch:

jobs:
  generate-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium
        
    - name: Run Bing Image Generator
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py --machine_id 1 --total_machines 1

    - name: Save Images Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bing_images
        path: bing_automated_images/

    - id: set-matrix
      run: |
        cd bing_automated_images
        count=$(ls Generated_Image_*.jpg 2>/dev/null | wc -l)
        echo "Total Images Generated: $count"
        matrix_json=$(python3 -c "import json; print(json.dumps(list(range(1, $count + 1))))")
        echo "matrix=$matrix_json" >> $GITHUB_OUTPUT

  generate-videos:
    needs: generate-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2  # 🔥 Sirf 2 machines ek sath chalengi taaki naye IP ke sath limit cross na ho
      matrix:
        machine_id: ${{ fromJson(needs.generate-images.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Download Images Artifact
      uses: actions/download-artifact@v4
      with:
        name: bing_images
        path: bing_automated_images/

    - run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    - name: Run Upsampler Video Generator
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_video.py ${{ matrix.machine_id }} 1

    - name: Save Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: video_machine_${{ matrix.machine_id }}
        path: generated_videos/

  zip-and-finish:
    needs: generate-videos
    runs-on: ubuntu-latest
    if: always()
    steps:
    - uses: actions/checkout@v4
    
    - name: Download All Video Artifacts
      uses: actions/download-artifact@v4
      with:
        path: all_downloaded_videos/

    - name: Create Single ZIP Package
      run: |
        mkdir -p final_output
        find all_downloaded_videos/ -type f -name "*.mp4" -exec cp {} final_output/ \;
        zip -r final_all_videos.zip final_output/

    - name: Upload Final ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: All_Generated_Videos_ZIP
        path: final_all_videos.zip
